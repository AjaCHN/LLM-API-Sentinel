<!DOCTYPE html>
<!-- LLM API Sentinel - High-fidelity interactive prototype (prototype.html v2.10.17)
 * 复用 assets/app.js + assets/data.js + assets/styles.css
 * 对齐 app/ 当前布局（max-w-[1400px] / .dark 双档语义色）
-->
<html lang="zh" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM API Sentinel · 高保真原型 v2.10.17</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    /* 入场 stagger */
    .stagger > * { opacity: 0; animation: fade-in-up 0.55s cubic-bezier(0.25,0.1,0.25,1) forwards; }
    .stagger > *:nth-child(1){animation-delay:.04s}
    .stagger > *:nth-child(2){animation-delay:.10s}
    .stagger > *:nth-child(3){animation-delay:.16s}
    .stagger > *:nth-child(4){animation-delay:.22s}
    .stagger > *:nth-child(5){animation-delay:.28s}
    .stagger > *:nth-child(6){animation-delay:.34s}
    /* 抽屉 */
    .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:48;opacity:0;pointer-events:none;transition:opacity .25s ease}
    .drawer-overlay.is-open{opacity:1;pointer-events:auto}
    .drawer{position:fixed;top:0;right:0;height:100vh;width:min(420px,92vw);background:var(--color-popover);border-left:1px solid var(--color-border);z-index:49;transform:translateX(100%);transition:transform .32s cubic-bezier(0.16,1,0.3,1);overflow-y:auto}
    .drawer.is-open{transform:translateX(0)}
    /* 详情进度环 */
    .ring-track{stroke:var(--color-border)}
    .ring-fill{stroke:var(--color-primary);transition:stroke-dashoffset .8s cubic-bezier(0.16,1,0.3,1)}
    /* 刷新按钮旋转 */
    #refreshBtn.is-spinning svg{animation:spin-once .7s ease-in-out}
    /* 实时 feed 新条目高亮 */
    .feed-enter{animation:slide-in-right .4s cubic-bezier(0.25,0.1,0.25,1) forwards}
    /* 骨架占位行 */
    .skel{height:12px;border-radius:6px}
    @media (prefers-reduced-motion: reduce){
      .stagger>*{animation:none;opacity:1}
      .drawer,.drawer-overlay{transition:none}
    }
  </style>
</head>
<body class="bg-ambient text-foreground font-sans min-h-screen antialiased">
  <!-- 告警横幅 -->
  <div id="alerts-banner" aria-live="polite"></div>

  <!-- 顶栏 -->
  <header id="app-header" class="sticky top-0 z-40 border-b border-border bg-background/80 backdrop-blur-xl">
    <div class="mx-auto max-w-[1400px] px-4 sm:px-6 py-3 flex items-center gap-4">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-primary to-accent flex items-center justify-center shadow-lg shadow-primary/20">
          <svg viewBox="0 0 24 24" class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h3l2 5 4-12 2 7h7"/></svg>
        </div>
        <div>
          <h1 class="text-base font-semibold leading-tight">LLM API Sentinel</h1>
          <p class="text-[11px] text-muted-foreground leading-tight" id="header-subtitle">全球 LLM API 实时监控</p>
        </div>
      </div>

      <div class="ml-auto flex items-center gap-2">
        <!-- 时间范围 -->
        <div role="group" aria-label="time range" id="time-range-group" class="hidden md:flex items-center gap-1 p-1 rounded-xl bg-secondary border border-border">
          <button data-range="1h" class="px-3 py-1.5 rounded-lg text-xs font-medium transition-colors"></button>
          <button data-range="24h" class="px-3 py-1.5 rounded-lg text-xs font-medium transition-colors"></button>
          <button data-range="7d" class="px-3 py-1.5 rounded-lg text-xs font-medium transition-colors"></button>
          <button data-range="30d" class="px-3 py-1.5 rounded-lg text-xs font-medium transition-colors"></button>
        </div>

        <span id="current-range" class="hidden md:inline text-xs text-muted-foreground font-medium">24H</span>

        <!-- 刷新 -->
        <button id="refreshBtn" onclick="refreshData()" aria-label="refresh data" class="relative p-2 rounded-xl border border-border hover:bg-secondary transition-colors">
          <svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>

        <!-- 语言 -->
        <button id="langBtn" onclick="toggleLang()" class="px-2.5 py-2 rounded-xl border border-border hover:bg-secondary text-xs font-medium transition-colors"></button>

        <!-- 主题 -->
        <button id="themeBtn" onclick="toggleTheme()" class="p-2 rounded-xl border border-border hover:bg-secondary transition-colors"></button>

        <!-- 设置 -->
        <button id="settingsBtn" onclick="openSettings()" aria-label="settings" class="p-2 rounded-xl border border-border hover:bg-secondary transition-colors">
          <svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>

        <!-- 告警铃铛 -->
        <button id="alerts-icon" onclick="openAlertsDialog()" aria-label="alerts" class="relative p-2 rounded-xl border border-border hover:bg-secondary transition-colors">
          <svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span id="alerts-badge" class="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-destructive text-destructive-foreground text-[10px] font-bold flex items-center justify-center hidden"></span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主体 -->
  <main class="mx-auto max-w-[1400px] px-4 sm:px-6 py-6 space-y-6">
    <!-- 统计卡 -->
    <section id="stats-grid" aria-label="overview stats" class="stagger grid grid-cols-2 lg:grid-cols-5 gap-3 sm:gap-4"></section>

    <!-- 延迟图表 -->
    <section id="latency-chart-card" class="card-hover-lift rounded-2xl bg-card border border-border p-5" aria-label="latency chart">
      <div class="flex items-center justify-between gap-3 mb-1">
        <div>
          <h2 class="text-sm font-semibold" id="chart-title">延迟趋势</h2>
          <p class="text-xs text-muted-foreground" id="chart-subtitle">各 API 响应延迟（ms）</p>
        </div>
        <div class="text-right">
          <div class="text-xs text-muted-foreground" id="chart-range-label">最近 24 小时</div>
          <div class="text-lg font-semibold tabular-nums" id="chart-avg">—</div>
        </div>
      </div>
      <div id="latency-chart"></div>
      <div id="latency-legend" class="chart-legend" role="group" aria-label="chart legend"></div>
    </section>

    <!-- 实时 feed + API 网格 -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <section id="live-feed-card" class="card-hover-lift rounded-2xl bg-card border border-border p-5 lg:col-span-1" aria-label="live feed">
        <div class="flex items-center gap-2 mb-3">
          <span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-success opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-success"></span></span>
          <h2 class="text-sm font-semibold" id="feed-title">实时动态</h2>
        </div>
        <div id="live-feed" class="space-y-2.5 max-h-[420px] overflow-y-auto pr-1"></div>
      </section>

      <section id="api-grid-card" class="rounded-2xl bg-card border border-border p-5 lg:col-span-2" aria-label="api grid">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-sm font-semibold" id="api-grid-title">API 状态</h2>
          <div class="flex items-center gap-2">
            <input id="api-search" type="search" placeholder="搜索…" aria-label="search apis" oninput="filterApis(this.value)" class="w-36 sm:w-44 px-3 py-1.5 text-xs rounded-lg bg-secondary border border-border focus:outline-none focus:ring-2 focus:ring-ring" />
          </div>
        </div>
        <div id="api-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3"></div>
        <!-- 空状态 -->
        <div id="api-empty" class="hidden py-12 text-center text-muted-foreground">
          <svg viewBox="0 0 24 24" class="w-10 h-10 mx-auto mb-2 opacity-40" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <p class="text-sm" id="empty-text">无匹配的 API</p>
        </div>
      </section>
    </div>

    <!-- 日志时间线（真实数据） -->
    <section id="logs-card" class="card-hover-lift rounded-2xl bg-card border border-border p-5" aria-label="event logs">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-sm font-semibold" id="logs-title">事件日志</h2>
        <span class="text-xs text-muted-foreground" id="logs-count"></span>
      </div>
      <ol id="logs-list" class="relative border-l border-border ml-2 space-y-4"></ol>
    </section>
  </main>

  <!-- 告警对话框 -->
  <div id="alerts-dialog" role="dialog" aria-modal="true" aria-labelledby="alerts-dialog-title" class="hidden">
    <div class="dialog-overlay" onclick="closeAlertsDialog()"></div>
    <div class="dialog-content w-[min(560px,92vw)] rounded-2xl bg-popover border border-border p-5" tabindex="-1">
      <div class="flex items-center justify-between mb-4">
        <h2 id="alerts-dialog-title" class="text-base font-semibold">告警</h2>
        <button onclick="closeAlertsDialog()" aria-label="close" class="p-1.5 rounded-lg hover:bg-secondary transition-colors">
          <svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="alerts-list" class="space-y-2.5"></div>
    </div>
  </div>

  <!-- 设置抽屉 -->
  <div id="settings-drawer-overlay" class="drawer-overlay" onclick="closeSettings()"></div>
  <aside id="settings-drawer" class="drawer" aria-label="settings" aria-hidden="true">
    <div class="p-5">
      <div class="flex items-center justify-between mb-5">
        <h2 class="text-base font-semibold" id="settings-title">设置</h2>
        <button onclick="closeSettings()" aria-label="close" class="p-1.5 rounded-lg hover:bg-secondary transition-colors">
          <svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="space-y-5">
        <div class="flex items-center justify-between">
          <div><div class="text-sm font-medium" id="settings-theme-label">深色模式</div><div class="text-xs text-muted-foreground" id="settings-theme-sub">切换浅色 / 深色外观</div></div>
          <button id="settings-theme-switch" class="switch" role="switch" aria-checked="true" aria-label="toggle dark mode" onclick="toggleTheme();syncSettingsSwitch()"><span class="switch-knob"></span></button>
        </div>
        <div class="flex items-center justify-between">
          <div><div class="text-sm font-medium" id="settings-lang-label">语言</div><div class="text-xs text-muted-foreground" id="settings-lang-sub">中文 / English</div></div>
          <button id="settings-lang-btn" onclick="toggleLang();syncSettingsSwitch()" class="px-3 py-1.5 rounded-lg text-xs border border-border hover:bg-secondary transition-colors"></button>
        </div>
        <div class="flex items-center justify-between">
          <div><div class="text-sm font-medium" id="settings-alert-label">桌面通知</div><div class="text-xs text-muted-foreground" id="settings-alert-sub">离线 / 降级时提醒</div></div>
          <button class="switch" role="switch" aria-checked="true" aria-label="toggle notifications"><span class="switch-knob"></span></button>
        </div>
        <div class="flex items-center justify-between">
          <div><div class="text-sm font-medium" id="settings-auto-label">自动刷新</div><div class="text-xs text-muted-foreground" id="settings-auto-sub">每 30 秒拉取一次</div></div>
          <button class="switch" role="switch" aria-checked="true" aria-label="toggle auto refresh"><span class="switch-knob"></span></button>
        </div>
      </div>
    </div>
  </aside>

  <!-- 详情抽屉 -->
  <div id="detail-drawer-overlay" class="drawer-overlay" onclick="closeDetail()"></div>
  <aside id="detail-drawer" class="drawer" aria-label="api detail" aria-hidden="true">
    <div id="detail-content" class="p-5"></div>
  </aside>

  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
