  <style type="text/tailwindcss">
    @import "tailwindcss";

    @theme {
      --font-sans: "Geist", "Geist Sans", system-ui, -apple-system, sans-serif;
      --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, monospace;

      --color-bg-base: #0a0a0f;
      --color-bg-card: #13131f;
      --color-bg-elevated: #1a1a2e;
      --color-primary: #6366f1;
      --color-secondary: #8b5cf6;
      --color-text-main: #f1f5f9;
      --color-text-muted: #94a3b8;
      --color-border: #27273a;
      --color-online: #10b981;
      --color-degraded: #f59e0b;
      --color-offline: #ef4444;
    }

    /* Light 模式颜色覆盖 */
    .light {
      --color-bg-base: #f8fafc;
      --color-bg-card: #ffffff;
      --color-bg-elevated: #f1f5f9;
      --color-text-main: #0f172a;
      --color-text-muted: #64748b;
      --color-border: #e2e8f0;
    }

    /* 入场动画 */
    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.85); opacity: 0.4; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    @keyframes spin-once {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .animate-fade-in-up {
      animation: fade-in-up 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }

    .animate-spin-once {
      animation: spin-once 0.6s ease-in-out;
    }

    /* 状态脉冲动画 */
    .status-pulse::after {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      background: inherit;
      animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      z-index: -1;
    }

    /* 卡片悬停微交互 */
    .api-card {
      transition: transform 0.25s cubic-bezier(0.25, 0.1, 0.25, 1),
                  box-shadow 0.25s cubic-bezier(0.25, 0.1, 0.25, 1),
                  border-color 0.25s ease;
    }

    .api-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(99, 102, 241, 0.08);
    }

    .light .api-card:hover {
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
    }

    /* 减少动画偏好支持 */
    @media (prefers-reduced-motion: reduce) {
      .animate-fade-in-up {
        animation: none;
        opacity: 1;
      }
      .status-pulse::after {
        animation: none;
      }
      .api-card {
        transition: none;
      }
    }

    /* 自定义滚动条 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--color-border);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--color-text-muted);
    }
  </style>

      'Moonshot AI': '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>',
      'ZhipuAI': '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>',
      'Alibaba': '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7l4.5-4.5L13 7l-4.5 4.5L4 7zM11 14l4.5-4.5L20 14l-4.5 4.5L11 14z"/></svg>',
      'Tencent': '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>',
      'Baidu': '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 8v8"/></svg>',
      'Baichuan AI': '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20"/></svg>',
      'DeepSeek': '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h4l3-9 3 18 3-9h4"/></svg>',
    };

    // 城市模拟数据（用于地理位置刷新）
    const mockCities = [
      { city: 'Shanghai', country: 'CN' },
      { city: 'Beijing', country: 'CN' },
      { city: 'Shenzhen', country: 'CN' },
      { city: 'Tokyo', country: 'JP' },
      { city: 'Singapore', country: 'SG' },
      { city: 'London', country: 'UK' },
      { city: 'New York', country: 'US' },
      { city: 'San Francisco', country: 'US' },
      { city: 'Frankfurt', country: 'DE' },
      { city: 'Sydney', country: 'AU' },
    ];

    // ============================================================
    //  工具函数
    // ============================================================

    function t(key) {
      return (i18n[currentLang] && i18n[currentLang][key]) || key;
    }

    function formatTimeAgo(timestamp) {
      const diff = Date.now() - timestamp;
      const minutes = Math.floor(diff / 60000);
      if (minutes < 1) return t('justNow');
      if (currentLang === 'zh') return `${minutes} ${t('minAgo')}`;
      return `${minutes}${t('minAgo')}`;
    }

    function getStatusColor(status) {
      if (status === 'online') return 'bg-online';
      if (status === 'degraded') return 'bg-degraded';
      return 'bg-offline';
    }

    function getStatusText(status) {
      if (status === 'online') return t('statusOnline');
      if (status === 'degraded') return t('statusDegraded');
      return t('statusOffline');
    }

    function getLatencyBarWidth(latency) {
      // 延迟条最大参考值 1500ms
      const max = 1500;
      if (latency <= 0) return '0%';
      return `${Math.min((latency / max) * 100, 100)}%`;
    }

    function getLatencyBarColor(latency) {
      if (latency <= 100) return 'bg-online';
      if (latency <= 300) return 'bg-primary';
      if (latency <= 800) return 'bg-degraded';
      return 'bg-offline';
    }

    // ============================================================
    //  渲染函数
    // ============================================================

    function updateI18n() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (i18n[currentLang] && i18n[currentLang][key]) {
          el.textContent = i18n[currentLang][key];
        }
      });
      document.title = t('title');
      document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
    }

    function renderStats() {
      const onlineCount = apis.filter(a => a.status === 'online').length;
      const degradedCount = apis.filter(a => a.status === 'degraded').length;
      const offlineCount = apis.filter(a => a.status === 'offline').length;
      const onlineApis = apis.filter(a => a.status === 'online' || a.status === 'degraded');
      const avgLatency = onlineApis.length > 0
        ? Math.round(onlineApis.reduce((sum, a) => sum + a.latency, 0) / onlineApis.length)
        : 0;

      document.getElementById('stat-online').textContent = onlineCount;
      document.getElementById('stat-degraded').textContent = degradedCount;
      document.getElementById('stat-offline').textContent = offlineCount;
      document.getElementById('stat-latency').innerHTML = `${avgLatency}<span class="text-sm font-normal text-text-muted ml-1">${t('unitMs')}</span>`;
    }

    function renderAlerts() {
      const degradedCount = apis.filter(a => a.status === 'degraded').length;
      const offlineCount = apis.filter(a => a.status === 'offline').length;
      const totalIssues = degradedCount + offlineCount;
      const banner = document.getElementById('alert-banner');

      if (totalIssues === 0) {
        banner.classList.add('hidden');
        return;
      }

      banner.classList.remove('hidden');
      document.getElementById('alert-count').textContent = totalIssues;

      let detailText = '';
      if (currentLang === 'zh') {
        const parts = [];
        if (offlineCount > 0) parts.push(`${offlineCount} 个服务离线`);
        if (degradedCount > 0) parts.push(`${degradedCount} 个服务降级`);
        detailText = parts.join(' · ');
      } else {
        const parts = [];
        if (offlineCount > 0) parts.push(`${offlineCount} offline`);
        if (degradedCount > 0) parts.push(`${degradedCount} degraded`);
        detailText = parts.join(' · ');
      }
      document.getElementById('alert-detail').textContent = detailText;
    }

    function renderApiGrid() {
      const container = document.getElementById('api-grid');
      container.innerHTML = '';

      // 按 region 分组
      const groups = { us: [], eu: [], cn: [] };
      apis.forEach(api => {
        if (groups[api.region]) groups[api.region].push(api);
      });

      const groupOrder = [
        { key: 'us', labelKey: 'providerGroupUS' },
        { key: 'cn', labelKey: 'providerGroupCN' },
      ];

      let globalDelayIndex = 0;

      groupOrder.forEach(group => {
        const items = groups[group.key];
        if (!items || items.length === 0) return;

        const sectionEl = document.createElement('div');
        sectionEl.className = 'animate-fade-in-up';
        sectionEl.style.animationDelay = `${0.3 + globalDelayIndex * 0.05}s`;

        // 分组标题
        const headerHtml = `
          <div class="flex items-center gap-2.5 mb-4">
            <div class="w-6 h-6 rounded-md bg-primary/10 flex items-center justify-center">
              <i data-lucide="layers" class="w-3.5 h-3.5 text-primary"></i>
            </div>
            <h3 class="text-sm font-semibold text-text-main">${t(group.labelKey)}</h3>
            <span class="text-[10px] font-mono text-text-muted bg-bg-elevated px-2 py-0.5 rounded-md">${items.length} APIs</span>
          </div>
        `;

        // API 卡片网格
        const gridEl = document.createElement('div');
        gridEl.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3';

        items.forEach((api, idx) => {
          const delay = (globalDelayIndex + idx) * 0.04;
          const statusColor = getStatusColor(api.status);
          const statusText = getStatusText(api.status);
          const borderClass = api.status === 'offline'
            ? 'border-offline/30'
            : api.status === 'degraded'
              ? 'border-degraded/30'
              : 'border-border/50';
          const providerIcon = providerIcons[api.provider] || '';

          const card = document.createElement('div');
          card.className = `api-card bg-bg-card rounded-xl p-4 border ${borderClass} animate-fade-in-up relative overflow-hidden`;
          card.style.animationDelay = `${delay}s`;

          // 离线状态的左侧指示条
          const leftBar = api.status === 'offline'
            ? '<div class="absolute top-0 left-0 w-0.5 h-full bg-offline"></div>'
            : '';

          const latencyBarWidth = getLatencyBarWidth(api.latency);
          const latencyBarColor = getLatencyBarColor(api.latency);
          const latencyDisplay = api.status === 'offline' ? t('timeout') : `${api.latency}${t('unitMs')}`;

          // 离线卡片的特殊布局
          const metricsHtml = api.status === 'offline'
            ? `
              <div class="bg-offline/8 rounded-lg p-3 mt-3">
                <div class="flex items-center justify-between">
                  <div>
                    <p class="text-[10px] text-text-muted uppercase tracking-wider mb-1">${t('retryCount')}</p>
                    <p class="text-base font-semibold text-offline">${api.retries || 0} ${currentLang === 'zh' ? '次' : ''}</p>
                  </div>
                  <div class="text-right">
                    <p class="text-[10px] text-text-muted uppercase tracking-wider mb-1">${t('lastSuccess')}</p>
                    <p class="text-xs font-medium text-offline">${formatTimeAgo(api.lastChecked - 300000)}</p>
                  </div>
                </div>
              </div>
            `
            : `
              <div class="grid grid-cols-2 gap-2 mt-3">
                <div class="bg-bg-elevated rounded-lg p-2.5">
                  <p class="text-[10px] text-text-muted uppercase tracking-wider mb-1">${t('availabilityLabel')}</p>
                  <p class="text-base font-semibold">${api.availability}%</p>
                </div>
                <div class="bg-bg-elevated rounded-lg p-2.5">
                  <p class="text-[10px] text-text-muted uppercase tracking-wider mb-1">${t('errorRateLabel')}</p>
                  <p class="text-base font-semibold ${api.errorRate > 1 ? 'text-degraded' : api.errorRate > 0 ? 'text-text-muted' : 'text-online'}">${api.errorRate}%</p>
                </div>
              </div>
            `;

          card.innerHTML = `
            ${leftBar}
            <div class="flex items-start justify-between mb-3">
              <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded-md bg-bg-elevated flex items-center justify-center text-text-muted">
                  ${providerIcon}
                </div>
                <div>
                  <h4 class="text-sm font-semibold leading-tight">${api.name}</h4>
                  <p class="text-[11px] text-text-muted mt-0.5">${api.provider}</p>
                </div>
              </div>
              <div class="flex items-center gap-1.5">
                <div class="relative w-2 h-2">
                  <div class="w-2 h-2 rounded-full ${statusColor} ${api.status !== 'online' ? 'status-pulse' : ''}"></div>
                </div>
                <span class="text-[11px] font-medium ${statusColor.replace('bg-', 'text-')}">${statusText}</span>
              </div>
            </div>
            <div>
              <div class="flex items-center justify-between text-xs mb-1.5">
                <span class="text-text-muted">${t('latencyLabel')}</span>
                <span class="font-semibold ${api.status === 'offline' ? 'text-offline' : api.latency > 800 ? 'text-degraded' : ''}">${latencyDisplay}</span>
              </div>
              <div class="h-1 bg-bg-elevated rounded-full overflow-hidden">
                <div class="h-full ${latencyBarColor} rounded-full transition-all duration-500" style="width: ${latencyBarWidth}"></div>
              </div>
            </div>
            ${metricsHtml}
            <div class="flex items-center justify-between text-[10px] text-text-muted/60 mt-3 pt-2 border-t border-border/30">
              <span>${formatTimeAgo(api.lastChecked)}</span>
              ${api.status === 'offline'
                ? `<span class="flex items-center gap-1 px-1.5 py-0.5 bg-offline/10 text-offline rounded text-[10px]">${t('needAttention')}</span>`
                : ''}
            </div>
          `;

          gridEl.appendChild(card);
        });

        sectionEl.innerHTML = headerHtml;
        sectionEl.appendChild(gridEl);
        container.appendChild(sectionEl);

        globalDelayIndex += items.length;
      });

      // 重新初始化 Lucide 图标
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }
    }

    function updateTimeRangeUI() {
      document.querySelectorAll('.time-range-btn').forEach(btn => {
        const range = btn.getAttribute('data-range');
        if (range === timeRange) {
          btn.classList.remove('text-text-muted', 'hover:text-text-main');
          btn.classList.add('bg-primary', 'text-white');
        } else {
          btn.classList.remove('bg-primary', 'text-white');
          btn.classList.add('text-text-muted', 'hover:text-text-main');
        }
      });
    }

    // ============================================================
    //  交互功能
    // ============================================================

    function toggleTheme() {
      const isDark = document.body.classList.contains('light');
      // 当前是 light，切换到 dark
      if (isDark) {
        document.body.classList.remove('light');
        currentTheme = 'dark';
      } else {
        document.body.classList.add('light');
        currentTheme = 'light';
      }
      localStorage.setItem('llm-sentinel-theme', currentTheme);
      updateThemeIcon();
    }

    function updateThemeIcon() {
      const container = document.getElementById('theme-icon-container');
      const isLight = document.body.classList.contains('light');
      if (isLight) {
        container.innerHTML = '<i data-lucide="moon" class="w-4 h-4 text-text-muted"></i>';
      } else {
        container.innerHTML = '<i data-lucide="sun" class="w-4 h-4 text-text-muted"></i>';
      }
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }
    }

    function toggleLang() {
      currentLang = currentLang === 'zh' ? 'en' : 'zh';
      localStorage.setItem('llm-sentinel-lang', currentLang);
      document.getElementById('lang-label').textContent = currentLang.toUpperCase();
      updateI18n();
      renderStats();
      renderAlerts();
      renderApiGrid();
    }

    function setTimeRange(range) {
      timeRange = range;
      updateTimeRangeUI();
      // 模拟时间范围切换效果：轻微随机化数据
      apis.forEach(api => {
        if (api.status !== 'offline') {
          const variation = (Math.random() - 0.5) * 40;
          api.latency = Math.max(20, Math.round(api.latency + variation));
        }
      });
      renderStats();
      renderApiGrid();
    }

    function refreshData() {
      const btn = document.getElementById('refresh-btn');
      const icon = btn.querySelector('i');
      if (icon) icon.classList.add('animate-spin-once');

      // 模拟数据刷新
      setTimeout(() => {
        apis.forEach(api => {
          api.lastChecked = Date.now() - Math.floor(Math.random() * 120000);
          if (api.status !== 'offline') {
            const variation = (Math.random() - 0.5) * 60;
            api.latency = Math.max(20, Math.round(api.latency + variation));
            // 随机波动可用性和错误率
            api.availability = Math.min(100, Math.max(95, parseFloat((api.availability + (Math.random() - 0.5) * 0.5).toFixed(1))));
            api.errorRate = Math.max(0, parseFloat((api.errorRate + (Math.random() - 0.5) * 0.2).toFixed(1)));
          }
        });
        renderStats();
        renderAlerts();
        renderApiGrid();
        if (icon) icon.classList.remove('animate-spin-once');
      }, 600);
    }

    function refreshGeo() {
      const textEl = document.getElementById('geo-text');
      const btn = document.getElementById('geo-refresh-btn');
      const icon = btn.querySelector('i');

      textEl.textContent = t('locationRefreshing');
      if (icon) icon.classList.add('animate-spin-once');

      // 尝试使用浏览器地理定位
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            // 真实定位成功，显示坐标（原型中简化显示）
            const lat = position.coords.latitude.toFixed(2);
            const lon = position.coords.longitude.toFixed(2);
            textEl.textContent = `${lat}, ${lon}`;
            if (icon) icon.classList.remove('animate-spin-once');
          },
          () => {
            // 定位失败，使用模拟数据
            setTimeout(() => {
              const city = mockCities[Math.floor(Math.random() * mockCities.length)];
              textEl.textContent = `${city.city}, ${city.country}`;
              if (icon) icon.classList.remove('animate-spin-once');
            }, 800);
          }
        );
      } else {
        setTimeout(() => {
          const city = mockCities[Math.floor(Math.random() * mockCities.length)];
          textEl.textContent = `${city.city}, ${city.country}`;
          if (icon) icon.classList.remove('animate-spin-once');
        }, 800);
      }
    }

    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      const el = document.getElementById('live-clock');
      if (el) el.textContent = `${h}:${m}:${s}`;
    }

    // ============================================================
    //  初始化
    // ============================================================

    function init() {
      // 应用主题
      if (currentTheme === 'light') {
        document.body.classList.add('light');
      }
      updateThemeIcon();

      // 应用语言
      document.getElementById('lang-label').textContent = currentLang.toUpperCase();
      updateI18n();

      // 初始化 Lucide 图标
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }

      // 渲染内容
      renderStats();
      renderAlerts();
      renderApiGrid();
      updateTimeRangeUI();

      // 启动实时时钟
      updateClock();
      clockInterval = setInterval(updateClock, 1000);

      // 监听系统主题变化
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
        if (!localStorage.getItem('llm-sentinel-theme')) {
          if (e.matches) {
            document.body.classList.remove('light');
            currentTheme = 'dark';
          } else {
            document.body.classList.add('light');
            currentTheme = 'light';
          }
          updateThemeIcon();
        }
      });
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
