<!DOCTYPE html>
<!--
  ⚠️ 历史原型归档 (Legacy Prototype, v2.10.1)
  - 本 prototype/ 为早期静态原型，已于 v2.10.0 与 app/ 实现产生差异：
    1. API 数量：本原型硬编码 12 个；app/constants/index.ts 已扩至 29 个
    2. 主题：本原型仅深色调（无 light）；app 已支持深/浅双主题（next-themes）
    3. 图表：本原型为手写 SVG；app 使用 Recharts AreaChart
    4. 布局：本原型 max-w-[1400px]；app 已加宽至 max-w-[1600px]
  - 规范以 openspec/features.md + ui.md 为准，代码以 app/ 为准。本原型仅供历史参考。
-->
<html lang="zh" class="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM API Sentinel v2.10.1 | 全球LLM API实时监控</title>
  <meta name="description" content="LLM API Sentinel — 实时监控全球主流 LLM API 服务健康状态" />
  <link rel="stylesheet" href="assets/styles.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-ambient min-h-screen font-sans text-foreground antialiased">
  <div class="mx-auto max-w-[1400px] px-4 sm:px-6 lg:px-8">

    <!-- ============ Header ============ -->
    <header class="sticky top-0 z-40 -mx-4 sm:-mx-6 lg:-mx-8 px-4 sm:px-6 lg:px-8 py-4 mb-8 bg-background/70 backdrop-blur-xl border-b border-border/60">
      <div class="flex items-center justify-between gap-4">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-primary to-accent flex items-center justify-center shadow-lg shadow-primary/20">
            <svg class="w-5 h-5 text-primary-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          </div>
          <div class="min-w-0">
            <h1 class="text-base sm:text-lg font-semibold tracking-tight truncate">LLM API Sentinel</h1>
            <div class="hidden sm:flex items-center gap-1.5 text-xs text-muted-foreground">
              <span id="live-clock" class="tabular-nums">00:00:00</span>
              <span class="w-1 h-1 rounded-full bg-success animate-pulse"></span>
              <span data-i18n="liveClock">Live</span>
            </div>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <a href="components.html" class="hidden sm:inline-flex text-sm text-muted-foreground hover:text-foreground link-underline transition-colors" data-i18n="docs">文档</a>
          <button id="lang-toggle" onclick="toggleLang()" class="px-2.5 py-1.5 rounded-lg text-sm border border-border hover:bg-secondary transition-colors" title="Language" aria-label="切换语言">中</button>
          <button id="theme-toggle" onclick="toggleTheme()" class="w-9 h-9 grid place-items-center rounded-lg border border-border hover:bg-secondary transition-colors" title="Theme" aria-label="切换主题"></button>
          <button class="px-3.5 py-1.5 rounded-lg text-sm font-medium bg-primary text-primary-foreground hover:opacity-90 transition-opacity" data-i18n="login">登录</button>
        </div>
      </div>
    </header>

    <!-- ============ Hero Section ============ -->
    <section class="animate-fade-in-up mb-10 text-center max-w-3xl mx-auto">
      <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium border border-border bg-card text-muted-foreground mb-5">
        <span class="w-1.5 h-1.5 rounded-full bg-success animate-pulse"></span>
        <span id="hero-api-online">—</span> <span data-i18n="statusOnline">在线</span> · <span id="hero-api-count">—</span> <span data-i18n="apiStatus">API 状态监控</span>
      </span>
      <h2 class="text-3xl sm:text-4xl lg:text-5xl font-bold tracking-tight leading-[1.1]">
        全球 LLM API<br class="sm:hidden" />
        <span class="bg-gradient-to-r from-primary via-accent to-primary bg-clip-text text-transparent">实时监控</span>
      </h2>
      <p class="mt-4 text-base sm:text-lg text-muted-foreground" data-i18n="apiStatusDesc">实时监控全球主流 LLM API 服务健康状态</p>
    </section>

    <!-- ============ Stats Grid ============ -->
    <section id="stats-grid" class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8"></section>

    <!-- ============ Alerts Banner ============ -->
    <section id="alerts-banner" class="mb-8"></section>

    <!-- ============ Main Grid ============ -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-10">
      <!-- Latency Chart -->
      <section class="lg:col-span-2 rounded-2xl border border-border bg-card p-5 sm:p-6">
        <div class="flex items-center justify-between gap-3 mb-5 flex-wrap">
          <div>
            <h3 class="font-semibold" data-i18n="latencyLabel">延迟</h3>
            <p class="text-xs text-muted-foreground" id="current-range" aria-live="polite">24H</p>
          </div>
          <div class="flex items-center gap-1 bg-secondary/50 rounded-lg p-1" role="group" aria-label="时间范围">
            <button data-range="24h" onclick="setTimeRange('24h')" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-primary text-primary-foreground transition-all" aria-pressed="true">24H</button>
            <button data-range="7d" onclick="setTimeRange('7d')" class="px-3 py-1.5 rounded-lg text-sm text-muted-foreground hover:text-foreground transition-colors" aria-pressed="false">7D</button>
            <button data-range="30d" onclick="setTimeRange('30d')" class="px-3 py-1.5 rounded-lg text-sm text-muted-foreground hover:text-foreground transition-colors" aria-pressed="false">30D</button>
          </div>
        </div>
        <svg id="latency-chart" class="chart-svg w-full" preserveAspectRatio="xMidYMid meet"></svg>
        <div id="chart-legend" class="chart-legend"></div>
        </section>

      <!-- Live Feed -->
      <section class="rounded-2xl border border-border bg-card p-5 sm:p-6">
        <div class="flex items-center justify-between mb-4">
          <div class="min-w-0">
            <h3 class="font-semibold" data-i18n="lastSuccessTime">上次成功</h3>
            <p class="text-xs text-muted-foreground" id="last-sync-time" aria-live="polite"></p>
          </div>
          <button id="refresh-btn" onclick="refreshData()" class="w-8 h-8 grid place-items-center rounded-lg border border-border hover:bg-secondary transition-colors" title="Refresh" aria-label="刷新数据">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
          </button>
        </div>
        <div id="live-feed" class="space-y-2.5 max-h-[200px] overflow-y-auto pr-1"></div>
      </section>
    </div>

    <!-- ============ API Status Grid ============ -->
    <section class="mb-12">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h3 class="font-semibold text-lg" data-i18n="apiStatus">API 状态监控</h3>
          <p class="text-sm text-muted-foreground" data-i18n="apiStatusDesc">实时监控全球主流 LLM API 服务健康状态</p>
        </div>
        <div class="text-xs text-muted-foreground flex items-center gap-2">
          <span data-i18n="location">Location</span>: <span id="current-location" class="font-mono text-foreground">Shanghai, CN</span>
        </div>
      </div>
      <div id="api-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
    </section>

    <!-- ============ Footer ============ -->
    <footer class="border-t border-border/60 py-8 mt-12">
      <div class="flex flex-col sm:flex-row items-center justify-between gap-4 text-sm text-muted-foreground">
        <span data-i18n="footerCopyright">LLM API Sentinel. All rights reserved.</span>
        <div class="flex items-center gap-5">
          <a href="components.html" class="hover:text-foreground link-underline transition-colors" data-i18n="docs">文档</a>
          <a href="#" onclick="return false" class="hover:text-foreground link-underline transition-colors" data-i18n="github">GitHub</a>
          <a href="#" onclick="return false" class="hover:text-foreground link-underline transition-colors" data-i18n="issues">问题反馈</a>
        </div>
      </div>
    </footer>
  </div>

  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    // 仪表盘渲染
    function renderDashboard() {
      renderStats();
      renderAlertsBanner();
      renderMultiLineChart();
      renderLiveFeed();
      renderApiGrid();
      const hc = document.getElementById('hero-api-count');
      if (hc) hc.textContent = apis.length;
      const ho = document.getElementById('hero-api-online');
      if (ho) ho.textContent = apis.filter(a => a.status === 'online').length;
      const ls = document.getElementById('last-sync-time');
      if (ls) ls.textContent = getT().justNow;
    }
    function renderLiveFeed() {
      const feed = document.getElementById('live-feed');
      if (!feed) return;
      const t = getT();
      const items = apis
        .filter(a => a.status !== 'offline')
        .sort((a, b) => b.lastChecked - a.lastChecked)
        .slice(0, 6)
        .map(a => `
          <div class="flex items-center gap-2 text-sm">
            <span class="w-2 h-2 rounded-full status-dot-online" style="background:${getStatusColor(a.status)}"></span>
            <span class="font-medium truncate">${a.name}</span>
            <span class="text-muted-foreground ml-auto whitespace-nowrap">${timeAgo(a.lastChecked)}</span>
          </div>`).join('');
      feed.innerHTML = items;
    }
    function renderApiGrid() {
      const grid = document.getElementById('api-grid');
      if (!grid) return;
      const t = getT();
      const groups = [
        { label: t.providerGroupUS, ids: ['openai-gpt-4o','anthropic-claude-3-5','google-gemini-1-5','meta-llama-3','mistral-large'] },
        { label: t.providerGroupCN, ids: ['moonshot-v1','zhipu-glm-4','baichuan-2','qwen-max','hunyuan-pro','ernie-4','deepseek-v3'] },
      ];
      // 进度条基准：取可视非离线 API 的最大延迟（下限 500ms），保证相对区分度
      const latencyBase = Math.max(500, ...apis.filter(a => a.status !== 'offline').map(a => a.latency));
      grid.innerHTML = groups.map(g => `
        <div class="col-span-full flex items-center gap-2 mt-4 mb-1">
          <span class="text-xs font-medium uppercase tracking-wider text-muted-foreground">${g.label}</span>
          <span class="h-px flex-1 bg-border/60"></span>
        </div>
        ${g.ids.map(id => {
          const a = apis.find(x => x.id === id);
          if (!a) return '';
          const offline = a.status === 'offline';
          return `
          <div class="animate-fade-in-up card-hover-lift rounded-xl border border-border bg-card p-4">
            <div class="flex items-start justify-between gap-2">
              <div class="flex items-center gap-2.5 min-w-0">
                <span class="w-8 h-8 rounded-lg grid place-items-center" style="background:color-mix(in srgb,${a.color} 15%,transparent);color:color-mix(in srgb,${a.color} 72%,var(--color-foreground))">${providerIcons[a.provider] || ''}</span>
                <div class="min-w-0">
                  <div class="font-medium truncate">${a.name}</div>
                  <div class="text-xs text-muted-foreground truncate">${a.provider}</div>
                </div>
              </div>
              <span class="px-2 py-0.5 rounded-full text-xs font-medium whitespace-nowrap" style="background:color-mix(in srgb,${getStatusColor(a.status)} 15%,transparent);color:color-mix(in srgb,${getStatusColor(a.status)} 72%,var(--color-foreground))">${getStatusText(a.status)}</span>
            </div>
            <div class="grid grid-cols-3 gap-2 mt-4 text-center">
              <div>
                <div class="text-[10px] text-muted-foreground uppercase">${t.latencyLabel}</div>
                <div class="text-sm font-semibold tabular-nums">${offline ? '—' : a.latency + t.unitMs}</div>
              </div>
              <div>
                <div class="text-[10px] text-muted-foreground uppercase">${t.availabilityLabel}</div>
                <div class="text-sm font-semibold tabular-nums">${a.availability}%</div>
              </div>
              <div>
                <div class="text-[10px] text-muted-foreground uppercase">${t.errorRateLabel}</div>
                <div class="text-sm font-semibold tabular-nums">${a.errorRate}%</div>
              </div>
            </div>
            ${offline ? `<div class="mt-3 text-xs text-destructive text-center">${t.needAttention} · ${a.retries || 0}×</div>` : `
            <div class="mt-3">
              <div class="h-1.5 rounded-full bg-secondary overflow-hidden">
                <div class="h-full rounded-full relative" style="width:${Math.min(100, Math.round(a.latency / latencyBase * 100))}%;background:${a.color}">
                  <div class="shimmer-overlay"></div>
                </div>
              </div>
            </div>`}
          </div>`;
        }).join('')}
      `).join('');
    }

    generateChartData();
    getCurrentLocation();
    appInit(renderDashboard);
  </script>
</body>
</html>
