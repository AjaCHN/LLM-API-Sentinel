name: Bug Report
description: 报告一个缺陷或异常行为
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交 Bug 报告！请尽量提供完整信息以便复现与定位。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰简洁地描述缺陷现象。
      placeholder: 发生了什么异常？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 如何复现该问题？
      placeholder: |
        1. 进入 '...'
        2. 点击 '...'
        3. 看到错误 '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？（可附日志、截图）
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本号
      description: 问题出现的版本（见 package.json version）
      placeholder: v2.7.1
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题区域
      options:
        - 仪表盘 UI
        - 实时监控
        - 历史趋势
        - 告警系统
        - 认证 (Supabase/Google OAuth)
        - 部署/构建
        - 国际化 (i18n)
        - 其他
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 浏览器、操作系统、Node 版本等
      placeholder: |
        - OS: Windows 11
        - Browser: Chrome 120
        - Node: 20.x
