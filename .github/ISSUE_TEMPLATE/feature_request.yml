name: Feature Request
description: 提出新功能或改进建议
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 相关痛点
      description: 这个功能要解决什么问题？现有方案的不足？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你希望如何实现这个功能？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他实现方式？
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 截图、参考链接、相关 Issue 等
